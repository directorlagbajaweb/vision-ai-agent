<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VISION</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body data-state="idle">

  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">VISION</span>
      </div>
      <div class="state-pill" id="state-pill">
        <span class="state-dot"></span>
        <span class="state-label" id="state-label">idle</span>
      </div>
    </header>

    <section class="stage">
      <div class="visualizer" id="visualizer" aria-hidden="true"></div>
      <p class="agent-hint" id="agent-hint">Say &ldquo;Vision&rdquo; to start</p>
    </section>

    <main class="transcript" id="transcript">
      <div class="transcript-empty" id="transcript-empty">
        <p>No conversation yet.</p>
        <p class="dim">Everything you say and everything VISION does shows up here.</p>
      </div>
      <div class="transcript-feed" id="transcript-feed"></div>
    </main>

    <footer class="controlbar">
      <button id="mic-btn" class="mic-btn" type="button" title="Mute VISION" aria-pressed="false">
        <svg class="icon icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <path d="M12 18v3"></path>
        </svg>
        <svg class="icon icon-mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 9V6a3 3 0 0 0-5.7-1.3"></path>
          <path d="M9 9v2a3 3 0 0 0 4.6 2.5"></path>
          <path d="M5 11a7 7 0 0 0 10.9 5.8"></path>
          <path d="M19 11a6.9 6.9 0 0 1-.7 3"></path>
          <path d="M12 18v3"></path>
          <path d="M4 3l16 16"></path>
        </svg>
        <span class="mic-label" id="mic-label">Mic on</span>
        <span class="mic-meter"><span class="mic-meter-fill" id="mic-meter-fill"></span></span>
      </button>

      <div class="chips">
        <span class="chip" id="chip-screen"><span class="chip-dot"></span>Screen</span>
        <span class="chip" id="chip-camera"><span class="chip-dot"></span>Camera</span>
        <span class="chip chip-tool" id="chip-tool"><span class="chip-spinner"></span><span id="chip-tool-name">tool</span></span>
      </div>

      <button id="clear-btn" class="ghost-btn" type="button" title="Clear the transcript view">Clear</button>
    </footer>

  </div>

  <div class="overlay" id="page-overlay">
    <div class="overlay-head">
      <span class="overlay-title">Rendered page</span>
      <button id="overlay-close" class="ghost-btn" type="button">Close</button>
    </div>
    <iframe id="page-frame" class="overlay-frame" sandbox="allow-scripts"></iframe>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
